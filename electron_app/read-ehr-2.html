        const fileInput = document.getElementById('fileInput');
        const workspace = document.getElementById('workspace');
        const patientBanner = document.getElementById('patientBanner');
        const printBtn = document.getElementById('printBtn');

        function changeLanguage(lang) {
            currentLang = lang;
            document.body.dir = (lang === 'ar') ? 'rtl' : 'ltr';
            
            // Translate Static Nav Items
            document.getElementById('txt-nav-title').textContent = dict[lang].navTitle;
            document.getElementById('txt-nav-subtitle').textContent = dict[lang].navSubtitle;
            document.getElementById('txt-btn-print').textContent = dict[lang].btnPrint;
            document.getElementById('txt-btn-load').textContent = dict[lang].btnLoad;

            if (fhirData) {
                buildDashboardView();
            } else {
                renderEmptyState();
            }
        }

        fileInput.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;
            try {
                const text = await file.text();
                const bundle = JSON.parse(text);
                parseFHIRComponents(bundle);
            } catch (err) {
                alert("Error loading clinical charts. Check standard format protocols.");
                console.error(err);
            }
        });

        function parseFHIRComponents(bundle) {
            if (!bundle || !bundle.entry) return;
            const sortedRegistry = {};
            bundle.entry.forEach(item => {
                const res = item.resource;
                if (!res || !res.resourceType) return;
                if (!sortedRegistry[res.resourceType]) sortedRegistry[res.resourceType] = [];
                sortedRegistry[res.resourceType].push(res);
            });
            fhirData = sortedRegistry;
            buildDashboardView();
        }

        function renderEmptyState() {
            const l = dict[currentLang];
            patientBanner.style.display = 'none';
            printBtn.disabled = true;
            workspace.innerHTML = `
                <div class="empty-state">
                    <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line></svg>
                    <h2>${l.emptyTitle}</h2>
                    <p>${l.emptyDesc}</p>
                </div>
            `;
        }

        function buildDashboardView() {
            const l = dict[currentLang];
            const data = fhirData;
            const pt = (data['Patient'] || [])[0];
            if (!pt) { alert("Invalid Document Structure: Missing Patient index record."); return; }

            printBtn.disabled = false;
            
            const ptName = extractPatientName(pt);
            const dob = pt.birthDate || '—';
            const gender = pt.gender || '—';
            const mrn = pt.id || '—';
            const allergiesList = data['AllergyIntolerance'] || [];

            // ── RENDER IDENTITY STRIP ──
            patientBanner.style.display = 'flex';
            patientBanner.innerHTML = `
                <div class="banner-pt-name">👤 ${ptName}</div>
                <div class="banner-metrics">
                    <div class="banner-meta-item"><div class="banner-meta-label">${l.labelDob}</div><div class="banner-meta-val">${dob}</div></div>
                    <div class="banner-meta-item"><div class="banner-meta-label">${l.labelSex}</div><div class="banner-meta-val" style="text-transform:uppercase;">${gender}</div></div>
                    <div class="banner-meta-item"><div class="banner-meta-label">${l.labelMrn}</div><div class="banner-meta-val" style="font-family:'JetBrains Mono',monospace;">${mrn}</div></div>
                </div>
                ${allergiesList.length ? `
                    <div class="banner-allergy-alert">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path></svg>
                        ${allergiesList.length} ${l.labelAllergyAlert}
                    </div>
                ` : ''}
            `;

            let mainColumnHTML = '';
            let sideColumnHTML = '';

            // 1. PATHOLOGY DEMOGRAPHICS
            const phone = pt.telecom?.find(t => t.system === 'phone')?.value || '—';
            const lang = pt.communication?.[0]?.language?.text || pt.communication?.[0]?.language?.coding?.[0]?.display || '—';
            const emergencyNode = pt.contact?.[0] ? `${pt.contact[0].name?.text || 'Contact'} (${pt.contact[0].relationship?.[0]?.text || 'NK'}) - ${pt.contact[0].telecom?.[0]?.value || ''}` : '—';
            const bloodObs = (data['Observation'] || []).find(o => o.code?.text?.toLowerCase().includes('blood type') || o.code?.text?.toLowerCase().includes('blood group'));
            const bloodType = bloodObs ? (bloodObs.valueString || bloodObs.valueCodeableConcept?.text || '—') : '—';

            mainColumnHTML += `
                <div class="card">
                    <div class="card-header">
                        <div class="header-title">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" style="color:var(--accent);"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                            <h3>${l.h1}</h3>
                        </div>
                    </div>
                    <div class="card-body">
                        <div class="info-matrix">
                            <div class="matrix-cell"><div class="matrix-label">${l.fName}</div><div class="matrix-value value-accent">${ptName}</div></div>
                            <div class="matrix-cell"><div class="matrix-label">${l.fDob}</div><div class="matrix-value">${dob}</div></div>
                            <div class="matrix-cell"><div class="matrix-label">${l.fSex}</div><div class="matrix-value" style="text-transform:uppercase;">${gender}</div></div>
                            <div class="matrix-cell"><div class="matrix-label">${l.fBlood}</div><div class="matrix-value">${bloodType}</div></div>
                            <div class="matrix-cell"><div class="matrix-label">${l.fPhone}</div><div class="matrix-value">${phone}</div></div>
                            <div class="matrix-cell"><div class="matrix-label">${l.fLang}</div><div class="matrix-value">${lang}</div></div>
                            <div class="matrix-cell" style="grid-column: 1 / -1;"><div class="matrix-label">${l.fNok}</div><div class="matrix-value">${emergencyNode}</div></div>
                        </div>
                    </div>
                </div>
            `;

            // 2. ADVERSE REACTIONS
            if (allergiesList.length) {
                mainColumnHTML += `
                    <div class="card">
                        <div class="card-header">
                            <div class="header-title">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" style="color:var(--danger);"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path></svg>
                                <h3>${l.h2}</h3>
                            </div>
                            <span class="counter-badge status-red">${allergiesList.length}</span>
                        </div>
                        <div class="card-body" style="padding:0;">
                            <table class="table-matrix">
                                <thead><tr><th>${l.tSubstance}</th><th>${l.tManifest}</th><th>${l.tSeverity}</th><th>${l.tStatus}</th></tr></thead>
                                <tbody>
                                    ${allergiesList.map(a => {
                                        const allergen = a.code?.coding?.[0]?.display || a.code?.text || '—';
                                        const manifestation = a.reaction?.[0]?.manifestation?.[0]?.coding?.[0]?.display || '—';
                                        const severity = a.reaction?.[0]?.severity || 'unknown';
                                        const status = a.clinicalStatus?.coding?.[0]?.code || 'active';
                                        return `<tr>
                                            <td><strong style="color:var(--danger);">${allergen}</strong></td>
                                            <td><strong>${manifestation}</strong></td>
                                            <td><span class="status-tag ${severity === 'severe' ? 'status-red' : 'status-amber'}">${severity}</span></td>
                                            <td><span class="status-tag status-red">${status}</span></td>
                                        </tr>`;
                                    }).join('')}
                                </tbody>
                            </table>
                        </div>
                    </div>
                `;
            }

            // 3. OBJECTIVE VITALS
            const observations = data['Observation'] || [];
            const vitalsObs = observations.filter(o => o.category?.some(c => c.coding?.some(cd => cd.code === 'vital-signs')));
            if (vitalsObs.length) {
                const latestVitals = {};
                vitalsObs.forEach(v => {
                    const title = v.code?.coding?.[0]?.display || v.code?.text;
                    if (!title) return;
                    if (!latestVitals[title] || new Date(v.effectiveDateTime) > new Date(latestVitals[title].effectiveDateTime)) {
                        latestVitals[title] = v;
                    }
                });

                mainColumnHTML += `
                    <div class="card">
                        <div class="card-header">
                            <div class="header-title">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" style="color:var(--success);"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>
                                <h3>${l.h3}</h3>
                            </div>
                        </div>
                        <div class="card-body">
                            <div class="vitals-strip">
                                ${Object.entries(latestVitals).map(([name, v]) => {
                                    let reading = '—';
                                    if (v.valueQuantity) reading = `${parseFloat(v.valueQuantity.value).toFixed(1)} ${v.valueQuantity.unit || ''}`;
                                    else if (v.component) reading = v.component.map(c => parseFloat(c.valueQuantity?.value || 0).toFixed(0)).join('/');
                                    const time = v.effectiveDateTime ? v.effectiveDateTime.split('T')[0] : '—';
                                    return `
                                        <div class="vital-box">
                                            <div class="vital-name">${name}</div>
                                            <div class="vital-val">${reading}</div>
                                            <div class="vital-time">${time}</div>
                                        </div>
                                    `;
                                }).join('')}
                            </div>
                        </div>
                    </div>
                `;
            }

            // 4. PHARMACOLOGICAL ACTIVE REGIMENS
            const medRequests = data['MedicationRequest'] || [];
            if (medRequests.length) {
                mainColumnHTML += `
                    <div class="card">
                        <div class="card-header">
                            <div class="header-title">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" style="color:var(--accent);"><circle cx="12" cy="12" r="10"></circle><path d="M12 8v8"></path><path d="M8 12h8"></path></svg>
                                <h3>${l.h4}</h3>
                            </div>
                        </div>
                        <div class="card-body" style="padding:0;">
                            <table class="table-matrix">
                                <thead><tr><th>${l.tMolecule}</th><th>${l.tSchedule}</th><th>${l.tStatus}</th><th>${l.tRationale}</th></tr></thead>
                                <tbody>
                                    ${medRequests.map(m => {
                                        const name = m.medicationCodeableConcept?.coding?.[0]?.display || m.medicationCodeableConcept?.text || '—';
                                        const dosage = m.dosageInstruction?.[0]?.text || '—';
                                        const status = m.status || 'active';
                                        const rationale = m.reasonCode?.[0]?.coding?.[0]?.display || m.reasonCode?.[0]?.text || '—';
                                        return `<tr>
                                            <td><strong style="color:var(--accent);">${name}</strong></td>
                                            <td><strong>${dosage}</strong></td>
                                            <td><span class="status-tag status-green">${status}</span></td>
                                            <td style="color:var(--slate-600); font-style:italic;">${rationale}</td>
                                        </tr>`;
                                    }).join('')}
                                </tbody>
                            </table>
                        </div>
                    </div>
                `;
            }

            // 5. DIAGNOSES
            const conditions = data['Condition'] || [];
            if (conditions.length) {
                mainColumnHTML += `
                    <div class="card">
                        <div class="card-header">
                            <div class="header-title">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" style="color:var(--danger);"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
                                <h3>${l.h5}</h3>
                            </div>
                            <span class="counter-badge status-red">${conditions.length}</span>
                        </div>
                        <div class="card-body" style="padding:0;">
                            <table class="table-matrix">
                                <thead><tr><th>${l.tDiagnosis}</th><th>${l.tState}</th><th>${l.tOnset}</th></tr></thead>
                                <tbody>
                                    ${conditions.map(c => {
                                        const name = c.code?.coding?.[0]?.display || c.code?.text || '—';
                                        const status = c.clinicalStatus?.coding?.[0]?.code || 'active';
                                        const verification = c.verificationStatus?.coding?.[0]?.code || 'confirmed';
                                        return `<tr>
                                            <td><strong style="color:var(--slate-900);">${name}</strong></td>
                                            <td><span class="status-tag ${status === 'active' ? 'status-red' : 'status-gray'}">${status}</span></td>
                                            <td><span class="status-tag status-gray">${verification}</span></td>
                                        </tr>`;
                                    }).join('')}
                                </tbody>
                            </table>
                        </div>
                    </div>
                `;
            }

            // 6. CLINICAL TIMELINE
            const encounters = data['Encounter'] || [];
            if (encounters.length) {
                sideColumnHTML += `
                    <div class="card">
                        <div class="card-header">
                            <div class="header-title">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line></svg>
                                <h3>${l.h6}</h3>
                            </div>
                        </div>
                        <div class="card-body" style="padding:0;">
                            <table class="table-matrix">
                                <thead><tr><th>${l.tContext}</th><th>${l.tDate}</th><th>${l.tComplaint}</th></tr></thead>
                                <tbody>
                                    ${encounters.slice(0, 6).map(e => {
                                        const type = e.class?.code || e.class?.display || 'Outpatient';
                                        const date = e.period?.start ? e.period.start.split('T')[0] : '—';
                                        const complaint = e.reasonCode?.[0]?.coding?.[0]?.display || e.reasonCode?.[0]?.text || '—';
                                        return `<tr>
                                            <td><strong style="text-transform:capitalize;">${type}</strong></td>
                                            <td>${date}</td>
                                            <td style="color:var(--slate-600); font-size:0.78rem;">${complaint}</td>
                                        </tr>`;
                                    }).join('')}
                                </tbody>
                            </table>
                        </div>
                    </div>
                `;
            }

            // 7. DIAGNOSTIC LABS
            const labObs = observations.filter(o => o.category?.some(c => c.coding?.some(cd => cd.code === 'laboratory')));
            if (labObs.length) {
                mainColumnHTML += `
                    <div class="card">
                        <div class="card-header">
                            <div class="header-title">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" style="color:var(--warning);"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path></svg>
                                <h3>${l.h7}</h3>
                            </div>
                        </div>
                        <div class="card-body" style="padding:0;">
                            <table class="table-matrix">
                                <thead><tr><th>${l.tAnalyte}</th><th>${l.tValue}</th><th>${l.tInterp}</th><th>${l.tReported}</th></tr></thead>
                                <tbody>
                                    ${labObs.slice(0, 15).map(lObj => {
                                        const name = lObj.code?.coding?.[0]?.display || lObj.code?.text || '—';
                                        const val = lObj.valueQuantity ? `${parseFloat(lObj.valueQuantity.value).toFixed(2)} ${lObj.valueQuantity.unit || ''}` : '—';
                                        const interpCode = lObj.interpretation?.[0]?.coding?.[0]?.code || 'N';
                                        const abnormal = interpCode !== 'N';
                                        return `<tr>
                                            <td><strong>${name}</strong></td>
                                            <td style="font-family:'JetBrains Mono',monospace; font-weight:700; ${abnormal ? 'color:var(--danger);' : 'color:var(--success);'}">${val}</td>
